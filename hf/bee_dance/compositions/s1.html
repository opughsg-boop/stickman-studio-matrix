    #root { position: absolute; inset: 0; background: linear-gradient(#bfe6ff, #eef8e8 60%, #9ccf7a); overflow: hidden; }
    .cap { position: absolute; left: 0; right: 0; top: 1480px; text-align: center; font: 900 84px 'CairoAr', sans-serif; color: #1f2a1a; }
  </style>
  <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
    <svg id="hive" class="clip" data-start="0" data-duration="7" width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
      <rect x="220" y="1000" width="640" height="420" fill="#c99a5b" stroke="#6b4321" stroke-width="16"/>
      <rect x="240" y="1020" width="600" height="380" fill="#f4d98a"/>
      <g id="cells"></g>
      <g id="bee" transform="translate(540 1200)">
        <ellipse cx="0" cy="0" rx="46" ry="30" fill="#f5c400" stroke="#1b1200" stroke-width="6"/>
        <rect x="-30" y="-20" width="16" height="40" fill="#1b1200"/>
        <rect x="6" y="-20" width="16" height="40" fill="#1b1200"/>
        <ellipse cx="-4" cy="-34" rx="26" ry="16" fill="#e8f6ff" opacity=".8" stroke="#6b8" stroke-width="3"/>
      </g>
    </svg>
    <div id="cap1" class="cap clip" data-start="0.2" data-duration="6.6">نحلة بترقص</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const cells = document.getElementById("cells");
    for (let r = 0; r < 8; r++) for (let c = 0; c < 10; c++) {
      const x = 260 + c * 56 + (r % 2) * 28, y = 1040 + r * 46;
      const h = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      h.setAttribute("points", [0,1,2,3,4,5].map(k => { const a = Math.PI/3*k; return (x + 26*Math.cos(a)).toFixed(1)+","+(y + 26*Math.sin(a)).toFixed(1); }).join(" "));
      h.setAttribute("fill", "none"); h.setAttribute("stroke", "#c8961e"); h.setAttribute("stroke-width", "3");
      cells.appendChild(h);
    }
    tl.fromTo("#bee", { x: -40 }, { x: 40, duration: 1.2, ease: "sine.inOut", repeat: 0 }, 0.2);
    tl.fromTo("#cap1", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.2);
    tl.to("#bee", { x: -40, duration: 1.2, ease: "sine.inOut" }, 1.6);
    window.__timelines["s1"] = tl;
  </script>
</template>
